[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "natwest-agentic-data-analysis"
version = "0.1.0"
description = "Project 4: Agentic Data Analysis with Tool Selection and Guardrails"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

